[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isipfin"
version = "0.1.0"
description = "Deterministic neuro-symbolic RAG chatbot for financial PDF Q&A (TM GenAI take-home)"
requires-python = "==3.11.*"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Errors + a small, boring rule set. No import-lock-in, no blanket ignores.
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Hermetic by contract (docs/CONSTRAINTS.md): no test may touch the network.
# Network-touching tests belong in scripts/eval_rag.py, which is deliberately not in testpaths.

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
# Scoped by design: only contract-bearing code is type-checked (docs/CONSTRAINTS.md).
files = ["src/utils", "src/chains"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
